<!doctype html>
<!-- «Арена» on the LG TV (ua.home.arena): the game's own app, so nobody opens a browser (Viktor 29.10.2026).
     It is one full-screen frame with the game's TV page http://192.168.1.26/tv (the host can be changed with the launch
     param {host: "…"}). webOS web apps render at 1920×1080, the TV upscales; the page fits itself to that frame.
     No `inset` shorthand and no flex `gap`: this TV's Chromium (webOS 6 ≈ 79) ignores them.
     Back on the remote closes the app (disableBackHistoryAPI). While the game server does not answer, a message and a
     retry every 10 s; the frame is loaded again once /health answers. Installed over root SSH from pult-core by
     tools/tv-app.sh (the TV's key lives only there). -->
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Арена</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b0f17; color: #e8eaed;
    font: 48px/1.3 "LG Smart UI", system-ui, sans-serif; }
  #game { border: 0; width: 1920px; height: 1080px; display: block; background: #0b0f17; }
  #err { display: none; position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; background: #0b0f17; }
  #err .ic { font-size: 160px; line-height: 1; margin-bottom: 30px; }
  #err .t { font-size: 60px; font-weight: 700; }
  #err .s { font-size: 36px; color: #9aa3b5; margin-top: 16px; }
</style>
</head>
<body>
<iframe id="game" title="Родинна арена"></iframe>
<div id="err"><div class="ic">⚔️</div><div class="t">Арена зараз не відповідає</div><div class="s" id="es">перевіряю щосекунди…</div></div>
<script>
(function () {
  var params = {};
  try { params = JSON.parse((window.PalmSystem && window.PalmSystem.launchParams) || "{}") || {}; } catch (e) {}
  var host = params.host || "192.168.1.26";
  var base = "http://" + host;
  var frame = document.getElementById("game"), err = document.getElementById("err"), es = document.getElementById("es");
  var up = false, tries = 0;
  function show(ok) {
    var was = up; up = ok;
    err.style.display = ok ? "none" : "flex";
    if (ok) { if (!was) frame.src = base + "/tv"; }
    else es.textContent = "адреса " + host + " · спроба " + tries;
  }
  function probe() {
    tries++;
    var x = new XMLHttpRequest();
    x.open("GET", base + "/health?t=" + Date.now(), true);
    x.timeout = 4000;
    x.onload = function () { show(x.status === 200); };
    x.onerror = x.ontimeout = function () { show(false); };
    try { x.send(); } catch (e) { show(false); }
  }
  probe();
  setInterval(probe, 10000);   // down: the message instead of a dead frame; back up: the frame is loaded again
  if (window.PalmSystem && window.PalmSystem.stageReady) window.PalmSystem.stageReady();
})();
</script>
</body>
</html>
